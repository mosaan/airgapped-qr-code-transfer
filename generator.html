<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>

  <body>
    <div id="app">
      <div
        class="flex flex-col items-start w-full items-center justify-center align-middle"
      >
        <div class="text-xl my-4">Data Sender Mode</div>
        <div class="text-sm mb-4">{{user_message}}</div>
        <div class="w-1/2 mb-4">
          <input
            class="block w-full text-sm text-gray-900 border border-gray-300 cursor-pointer bg-gray-50 focus:outline-none"
            id="file_input"
            type="file"
          />
        </div>
        <div class="w-1/2 mb-4 flex items-center gap-3">
          <label class="text-sm text-gray-700 whitespace-nowrap">
            Speed: {{chunks_per_sec}} chunks/sec ({{Math.round(1000/chunks_per_sec)}}ms)
          </label>
          <input
            type="range" min="1" max="20" step="1"
            v-model.number="chunks_per_sec"
            :disabled="is_transferring"
            class="w-full"
          />
        </div>
        <div class="w-1/2 mb-4">
          <div class="text-xs text-gray-500 mb-1">Resend range (blank = all chunks, 0-indexed)</div>
          <div class="flex items-center gap-2">
            <input type="number" min="0" placeholder="start"
              v-model="range_start"
              :disabled="is_transferring"
              class="w-24 border border-gray-300 text-sm px-1 py-0.5" />
            <span class="text-sm">–</span>
            <input type="number" min="0" placeholder="end"
              v-model="range_end"
              :disabled="is_transferring"
              class="w-24 border border-gray-300 text-sm px-1 py-0.5" />
          </div>
        </div>
        <button
          v-if="!is_transferring"
          v-on:click="start_transfer"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Start Transfer
        </button>
        <button
          v-else
          v-on:click="stop_transfer"
          class="mb-6 p-1 border-2 border-gray-500"
        >
          Stop Transfer
        </button>
        <div id="qrcode" class=""></div>
      </div>
    </div>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.0.3/pako.min.js"></script>
    <script>
      const { createApp, ref, onMounted } = Vue;


      createApp({
        setup() {
          const user_message = ref("Choose file to get started");
          const is_transferring = ref(false);
          const chunk_size = 600;
          const chunks_per_sec = ref(7);
          const range_start = ref('');
          const range_end = ref('');
          let qrcode_object = "";

          const encode_data = (index, input_bytes) => {
            const encoded_data = btoa(
              String.fromCharCode.apply(null, input_bytes)
            );
            return index + "," + encoded_data;
          };

          // ファイル内容（圧縮後バイト列）の先頭1024バイトから簡易ハッシュを計算し、
          // 「同名・同チャンク数だが別ファイル」を受信側が区別できるようにする。
          const compute_hash = (data_array) => {
            let hash = 0;
            for (let i = 0; i < Math.min(data_array.length, 1024); i++) {
              hash = (hash * 31 + data_array[i]) & 0xffffffff;
            }
            return (hash >>> 0).toString(16);
          };

          const stop_transfer = () => {
            is_transferring.value = false;
            user_message.value = "Choose file to get started";
          };

          const start_transfer = async () => {
            let file_input = document.getElementById("file_input");
            let file = file_input.files[0];
            // ファイル未選択で開始すると後続が例外で固まるため、ここで止める。
            if (!file) {
              user_message.value = "Please choose a file first";
              return;
            }
            is_transferring.value = true;
            try {
              let data_array = pako.gzip(await file.arrayBuffer(), { level: 9 });
              let total_chunks = Math.ceil(data_array.length / chunk_size);
              let file_hash = compute_hash(data_array);
              // ファイル名をUTF-8バイト列→base64に変換してASCII文字のみにする。
              // 日本語などマルチバイト文字を含むファイル名でもQRコードに収まる。
              const name_utf8 = new TextEncoder().encode(file.name);
              const name_b64 = btoa(String.fromCharCode.apply(null, name_utf8));
              let file_metadata = {
                name: name_b64,
                chunks: total_chunks,
                hash: file_hash,
              };
              let metadata_string = JSON.stringify(file_metadata);
              console.log("[META] metadata_string length=", metadata_string.length, "content=", metadata_string);
              user_message.value = "Starting data transfer in few seconds ...";
              qrcode_object.clear();
              qrcode_object.makeCode(metadata_string);
              await new Promise((r) => setTimeout(r, 1000));
              // 全チャンクを繰り返しループ送信する。1 回でも読み取りに失敗しても
              // 次のループで再送されるため、受信側が累積で取りこぼしを埋められる。
              let loop_count = 0;
              while (is_transferring.value) {
                loop_count++;
                // 送信範囲: 入力が空なら全チャンク、そうでなければ指定範囲にクランプ。
                const from = range_start.value !== '' ? Math.max(0, parseInt(range_start.value) || 0) : 0;
                const to = range_end.value !== '' ? Math.min(total_chunks - 1, parseInt(range_end.value) || total_chunks - 1) : total_chunks - 1;
                const range_label = (from === 0 && to === total_chunks - 1) ? '' : ` [${from}–${to}]`;
                // 各ループ冒頭でメタデータを再送し、途中参加の受信側にも転送情報を伝える。
                qrcode_object.clear();
                qrcode_object.makeCode(metadata_string);
                user_message.value = `Loop ${loop_count}${range_label}: sending metadata ...`;
                await new Promise((r) => setTimeout(r, Math.round(1000 / chunks_per_sec.value)));
                for (let i = from; i <= to; i++) {
                  if (!is_transferring.value) break;
                  let start = i * chunk_size;
                  let chunk = data_array.subarray(start, start + chunk_size);
                  let encoded_data = encode_data(i, chunk);
                  qrcode_object.clear();
                  qrcode_object.makeCode(encoded_data);
                  user_message.value = `Loop ${loop_count}${range_label}: chunk ${i}/${total_chunks - 1} ...`;
                  await new Promise((r) => setTimeout(r, Math.round(1000 / chunks_per_sec.value)));
                  if (!is_transferring.value) break;
                }
              }
            } catch (error) {
              // 例外を握りつぶさず UI に出し、停止状態へ確実に戻す。
              console.error("Transfer error: ", error);
              user_message.value = "Transfer error: " + error.message;
            } finally {
              is_transferring.value = false;
              qrcode_object.clear();
              qrcode_object.makeCode("Choose file to get started");
            }
          };

          onMounted(() => {
            console.log("Application Initialized ...");
            let lowest_size =
              Math.min(window.innerWidth, window.innerHeight) / 1.5;
            qrcode_object = new QRCode("qrcode", {
              text: "Choose file to get started",
              width: lowest_size,
              height: lowest_size,
              typeNumber: 40,
              colorDark: "#000000",
              colorLight: "#ffffff",
              correctLevel: QRCode.CorrectLevel.M,
            });
          });

          return {
            user_message,
            start_transfer,
            stop_transfer,
            is_transferring,
            chunks_per_sec,
            range_start,
            range_end,
          };
        },
      }).mount("#app");
    </script>
  </body>
</html>
